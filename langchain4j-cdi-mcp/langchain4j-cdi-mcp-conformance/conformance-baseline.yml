# Known failures of langchain4j-cdi-mcp against @modelcontextprotocol/conformance
# for the MCP 2026-07-28 (modern / stateless) run:
#
#   npx -y @modelcontextprotocol/conformance@alpha server \
#       --url http://localhost:8080/mcp --spec-version 2026-07-28 --suite all \
#       --expected-failures conformance-baseline.yml
#
# Use conformance-baseline-legacy.yml for the 2025-11-25 / stable-line runs.
# Entries are per-check where only one check of a scenario fails, so the other
# checks of that scenario stay enforced. Warnings count as failures for the gate
# and must be listed here too.
#
# Score at the time of writing: 133 passed, 9 failed.
# Every remaining entry is a missing feature or a known API limitation, not a
# protocol bug; see langchain4j-cdi-mcp/README.md ("Conformance").
server:
  # No API to supply a hand-written tool inputSchema: the schema is always
  # generated from the Java signature, so the SEP-1613/SEP-2106 fixture tool
  # `json_schema_2020_12_tool` cannot be expressed. The scenario's second check
  # (a $ref/$defs-carrying schema is not mangled) passes and stays enforced.
  - json-schema-2020-12:json-schema-2020-12-tool-found

  # SEP-2243: `test_custom_header_tool` now publishes `x-mcp-header` designations,
  # so the scenario runs for real instead of reporting 5 of 6 checks "not
  # testable". The three acceptance cases pass (valid Base64 decoded and matched
  # against the body; a value without the `=?base64?...?=` wrapper treated as a
  # literal, both for a missing prefix and a missing suffix).
  #
  # What remains is the *request* half of SEP-2243, which is a separate feature:
  # the server does not read `Mcp-Param-*` headers at all, so it cannot reject a
  # mismatch with HTTP 400 + JSON-RPC -32020. Three cases therefore still fail —
  # invalid Base64 padding, non-alphabet Base64 characters, and a header omitted
  # while the body carries the value. These are server obligations, not client
  # ones: they are reachable, but they need `Mcp-Param-*` validation wired into
  # the tools/call path, which this change deliberately does not add.
  - http-custom-header-server-validation:sep-2243-server-reject-invalid-param-chars
  - http-custom-header-server-validation:sep-2243-server-reject-param-mismatch
  # Emitted three times: twice SUCCESS (the two literal-value cases) and once
  # FAILURE (header omitted, value in body). The entry covers the failing row.
  - http-custom-header-server-validation:sep-2243-server-validate-param-match

  # SEP-2322 MRTR: the framework names input requests by call order
  # (`input-0`, `input-1`, ...); a fixture cannot choose the key `user_name`,
  # which these two checks require verbatim. Needs an API change on the
  # Elicitation / Sampling / Roots builders.
  - input-required-result-basic-elicitation:sep-2322-elicitation-incomplete
  - input-required-result-ignore-extra-params:sep-2322-ignore-unexpected-params

  # SEP-2322 MRTR: the blocking client-interaction API suspends on the first
  # pending interaction, so only one `inputRequests` entry is ever returned;
  # this check needs at least three of different methods in one result.
  - input-required-result-multiple-input-requests:sep-2322-multiple-inputs-incomplete
